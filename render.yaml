# One-click deploy on Render: New + > Blueprint > select this repo.
services:
  - type: web
    name: recomind
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase: { name: recomind-db, property: connectionString }
databases:
  - name: recomind-db
    plan: free
